[project]
name = "exam-docker-eval"
version = "1.0.0"
description = "Moteur d'evaluation en sandbox partage par les skills correcteurs"
requires-python = ">=3.11"
dependencies = [
    "testcontainers>=4.0",
    "docker>=7.0",
    "requests>=2.31",
    "pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/docker_eval"]
